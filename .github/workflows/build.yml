name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install pyinstaller qrcode Pillow

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name LanTransfer lantransfer.py

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LanTransfer.exe
          generate_release_notes: true
